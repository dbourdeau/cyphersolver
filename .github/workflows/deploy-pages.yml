# Deploy docs/ to GitHub Pages from our own workflow (Pages source: "GitHub Actions"), in place of the built-in
# "pages-build-deployment" run of "Deploy from a branch". The built-in deploy has a fixed 10-minute limit, and with a
# site upload of about 180 MB it often sat at "syncing_files" until that limit and failed (five times on 10 Nov 2026).
# Here the limit is 30 minutes. The build step is the same Jekyll build the branch deploy ran (docs/ has no .nojekyll),
# so the published files are unchanged: names starting with "_" stay unpublished.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a deploy still running, as the built-in deploy did.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      # The search index, feed, sitemap and menu are not in git (.gitignore, 10 Nov 2026): build them here. The build
      # is stdlib-only and idempotent; it also brings every page's furniture up to date, so the published site does
      # not wait for the "Site: rebuild" commit. Nothing is committed from this job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          pip install -q pillow || true
          python tools/make_thumbs.py || true
          (cd docs && python _build_site.py > /tmp/build.log 2>&1) || { tail -40 /tmp/build.log; exit 1; }
          test -s docs/search-t.json && test -s docs/menu.json && test -s docs/sitemap.xml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000        # 30 minutes, in milliseconds (the default is 10)
