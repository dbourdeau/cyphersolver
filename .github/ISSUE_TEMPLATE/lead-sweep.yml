name: Leads from an archive
description: Reserve an archive for your AI agent to search, then report the ciphered documents it found. No solution needed; an empty search counts too.
title: "Leads: <archive or series searched>"
labels: [contribution, leads]
body:
  - type: markdown
    attributes:
      value: |
        Start your agent in a checkout of the repository with: `Read research/SWEEP.md and follow it.` It reads what has been searched ([COVERAGE.md](https://github.com/dbourdeau/cyphersolver/blob/main/research/COVERAGE.md), [the index of sweeps](https://github.com/dbourdeau/cyphersolver/blob/main/research/README.md)) and tells you which archive it is taking.
        **To reserve that archive, submit this form with the first field filled and "in progress" in the next two.** When the agent is done, send its folder as a pull request that mentions this issue, or paste its summary here. Finds made by hand are welcome on the same form.
  - type: input
    id: searched
    attributes:
      label: Archive, portal or series searched
      description: For example "Archivio di Stato di Genova, Archivio Segreto, Lettere Ministri Spagna 1590-1610" or "Kalliope, term Chiffre".
    validations: {required: true}
  - type: textarea
    id: how
    attributes:
      label: How it was searched
      description: The agent and model used; the search terms and date, or the volumes paged through (which images); what blocked; what is left. The agent's final summary is enough.
    validations: {required: true}
  - type: textarea
    id: leads
    attributes:
      label: What you found
      description: |
        A link to the pull request with the sweep folder, or one block per item. Write "nothing found" if the search was empty.
        - archive, shelfmark, folio or image number, and a stable link
        - date, sender, recipient, place, expected language
        - what the archive's description says of the cipher (quote it)
        - did you see the ciphertext? What is on the leaf: signs, letters or numbers, how much, any decipherment on it or with it
        - how it can be seen: free online, behind a login, reading room only
    validations: {required: true}
  - type: textarea
    id: prior
    attributes:
      label: Earlier decipherments checked
      description: DECODE, Cryptiana (Tomokiyo), the printed edition or calendar, anything else, with what each showed. "Not checked" is a fine answer.
  - type: textarea
    id: keys
    attributes:
      label: Keys and cipher tables seen on the way (optional)
      description: A key with no letters beside it is still useful; it may open letters held elsewhere.
  - type: dropdown
    id: claim
    attributes:
      label: Do you want to work on any of these yourself?
      options:
        - "No, anyone may take them"
        - "Yes, hold them for me (say which below)"
  - type: input
    id: credit
    attributes:
      label: How to credit you
