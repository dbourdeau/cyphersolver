<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LJS 51 in 3D: Collection of alphabets and encoded correspondence</title>
<style>
  :root { --ink:#efe6d4; --dim:#a99f8c; --panel:rgba(20,17,14,.78); --line:rgba(239,230,212,.16); --accent:#d9a65a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#14110e; color:var(--ink);
    font:14px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  header { position:fixed; top:14px; left:16px; right:16px; display:flex; justify-content:space-between;
    align-items:flex-start; gap:16px; pointer-events:none; }
  header .t { pointer-events:auto; }
  h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:.01em; }
  .sub { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .sub a { color:var(--dim); }
  .help { color:var(--dim); font-size:12px; text-align:right; pointer-events:auto; max-width:300px; }
  #bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:min(760px,calc(100% - 24px));
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px 12px;
    backdrop-filter:blur(8px); }
  #labels { display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; min-height:18px; }
  #labels span { color:var(--ink); } #labels em { color:var(--dim); font-style:normal; }
  .row { display:flex; align-items:center; gap:10px; }
  button { font:inherit; font-size:13px; color:var(--ink); background:rgba(239,230,212,.07);
    border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; white-space:nowrap; }
  button:hover { background:rgba(239,230,212,.14); } button:disabled { opacity:.35; cursor:default; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); pointer-events:none;
    transition:opacity .5s; }
  .ez { display:none; }
  body.embed header { display:none; }
  body.embed .ez { display:inline-block; }
  body.embed #bar { bottom:10px; padding:8px 10px 10px; }
  @media (max-width:640px){ .help{display:none} #labels{font-size:12px} button{padding:6px 8px} }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header>
  <div class="t">
    <h1>LJS 51 · Collection of alphabets and encoded correspondence</h1>
    <div class="sub">Arabic manuscript, read right to left · photographs:
      <a href="https://openn.library.upenn.edu/Data/0001/html/ljs51.html" target="_blank" rel="noopener">University of Pennsylvania Libraries, OPenn</a> (public domain)</div>
  </div>
  <div class="help">Drag a page to turn it, or click it. Drag the background to orbit, scroll to zoom.
    Keys: ← forward, → back.</div>
</header>
<div id="loading">Loading the book…</div>
<div id="bar">
  <div id="labels"><em id="lblL"></em><span id="lblMid"></span><em id="lblR"></em></div>
  <div class="row">
    <button id="fwd" title="Turn the left page (← key)">← Forward</button>
    <input id="slider" type="range" min="0" max="112" step="1" value="0" dir="rtl" aria-label="Opening">
    <button id="back" title="Turn the right page back (→ key)">Back →</button>
    <button id="zout" class="ez" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button id="zin" class="ez" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="reset" title="Reset the camera">View</button>
  </div>
</div>

<script type="module" src="book.js"></script>
</body>
</html>
